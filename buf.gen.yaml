version: v2
managed:
  enabled: true
plugins:
  - remote: buf.build/bufbuild/es:v2.16.0
    out: ./src/proto
    include_imports: true
    opt:
      - target=js+dts
      - import_extension=.js
      - js_import_style=legacy_commonjs
inputs:
  - directory: ./
    paths:
      - dapr/proto/common/v1/common.proto
      - dapr/proto/durabletask/v1
      - dapr/proto/runtime/v1