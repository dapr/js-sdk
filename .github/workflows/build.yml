name: Build

on:
  push:
    branches:
      - main
      - release-*
    tags:
      - v*
  pull_request:
    branches:
      - main
      - release-*
  # Manual trigger
  workflow_dispatch: {}

permissions:
  id-token: write # Required for OIDC
  contents: read

env:
  NODE_VER: 24

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node_version: [22.16.0]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node ${{ matrix.node_version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node_version }}

      - name: Install dependencies
        run: npm install

      - name: Build package (lint, prettier, build)
        run: npm run build

      # @TODO: add a depend on the test-e2e pipeline?
      - name: Run unit tests
        id: tests
        run: npm run test:unit:all

      - name: Upload test coverage
        uses: codecov/codecov-action@ad3126e916f78f00edff4ed0317cf185271ccc2d # v5.4.2

  publish:
    needs: build
    if: startswith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node ${{ env.NODE_VER }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VER }}
          registry-url: "https://registry.npmjs.org"

      - name: Set version from tag
        run: |
          # Strip the leading 'v' from the tag ref (e.g. refs/tags/v1.2.3 -> 1.2.3)
          TAG="${GITHUB_REF#refs/tags/v}"
          npm version --no-git-tag-version "$TAG"

      - name: Install dependencies
        run: npm install

      - name: Build package
        run: npm run build-ci

      - name: Publish to npm (@dapr/dapr)
        run: npm publish build/ --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
